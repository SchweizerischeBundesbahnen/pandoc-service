<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DOCX corpus comparison</title>
<style>
  :root { --bg: #fff; --fg: #1d1d1f; --muted: #6b6b70; --line: #d9d9de; --panel: #f4f4f6; --pick: #e6effd; --missing: #d1242f; --shifted: #d97706; --good: #1a7f37; }
  @media (prefers-color-scheme: dark) { :root { --bg: #17171a; --fg: #ececf0; --muted: #9a9aa2; --line: #34343a; --panel: #212125; --pick: #1f2d44; } }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--fg); display: grid; grid-template-columns: 380px 1fr; height: 100vh; }
  aside { border-right: 1px solid var(--line); overflow: auto; }
  main { overflow: auto; padding: 16px 20px 40px; }
  header { padding: 12px 14px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); }
  h1 { font-size: 16px; margin: 0 0 6px; }
  .totals { color: var(--muted); font-size: 12px; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  th, td { padding: 4px 6px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; white-space: normal; word-break: break-all; }
  th { cursor: pointer; position: sticky; top: 0; background: var(--panel); }
  tr.doc { cursor: pointer; }
  tr.doc:hover, tr.doc.picked { background: var(--pick); }
  .bad { color: var(--missing); } .warn { color: var(--shifted); } .ok { color: var(--good); }
  .controls { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin: 10px 0 16px; }
  .controls label { display: flex; gap: 6px; align-items: center; }
  .pages { display: flex; flex-direction: column; gap: 22px; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .pair.stacked { grid-template-columns: 1fr; max-width: 900px; }
  .sheet { position: relative; border: 1px solid var(--line); background: #fff; }
  .sheet img { display: block; width: 100%; }
  .sheet .top { position: absolute; inset: 0; }
  .sheet .top img { position: absolute; inset: 0; }
  /* Swipe as in weasysvg: dragging the line changes the clip of the upper page and nothing else, so no page is
     drawn again and nothing flickers. Safari selects a dragged image: the prefixed rules keep it from that */
  .sheet.swipe { touch-action: none; user-select: none; -webkit-user-select: none; cursor: ew-resize; }
  .sheet.swipe img { -webkit-user-drag: none; }
  .sheet .top { will-change: clip-path; }
  .sheet .line { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #0969da; }
  .sheet .line::after { content: "\25C2 \25B8"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #0969da; color: #fff; border-radius: 12px; padding: 2px 8px; font-size: 12px; white-space: nowrap; }
  .sheet .line:focus-visible { outline: 2px solid #fff; }
  .sheet .tag { position: absolute; top: 6px; background: rgba(13, 17, 23, .75); color: #fff; font-size: 12px; padding: 1px 6px; border-radius: 4px; pointer-events: none; }
  .sheet .tag.left { left: 6px; } .sheet .tag.right { right: 6px; }
  .caption { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
  .empty { display: grid; place-items: center; aspect-ratio: 612 / 792; color: var(--muted); background: var(--panel); }
  ul.problems { font-size: 12px; columns: 2; padding-left: 18px; }
  a { color: inherit; }
</style>
</head>
<body>
<aside>
  <header>
    <h1>DOCX corpus: pandoc-service and Word</h1>
    <div class="totals" id="totals"></div>
  </header>
  <table>
    <thead><tr><th data-key="name">Document</th><th data-key="pages">Pages</th><th data-key="same">Same page</th><th data-key="shift">Shift</th><th data-key="words">Words</th><th data-key="regions">Regions</th></tr></thead>
    <tbody id="list"></tbody>
  </table>
</aside>
<main>
  <h2 id="title">Pick a document</h2>
  <div id="facts" class="totals"></div>
  <div class="controls">
    <label><input type="radio" name="mode" value="side" checked> side by side</label>
    <label><input type="radio" name="mode" value="overlay"> overlay</label>
    <label><input type="radio" name="mode" value="swipe"> swipe</label>
    <label><input type="radio" name="mode" value="difference"> difference</label>
    <label id="amount-label">conversion <input type="range" id="amount" min="0" max="100" value="50"></label>
    <span id="swipe-hint" class="totals">drag the line or move it with the arrow keys</span>
  </div>
  <div class="pages" id="pages"></div>
  <ul class="problems" id="problems"></ul>
</main>
<script id="corpus-data" type="application/json">__CORPUS_DATA__</script>
<script>
const data = JSON.parse(document.getElementById("corpus-data").textContent);
const documents = data.documents;
const percent = (part, whole) => whole ? (100 * part / whole) : 0;
const format = (value, digits = 1) => value === null || value === undefined ? "–" : Number(value).toFixed(digits);
const totals = document.getElementById("totals");
const lines = [`Reference: Word on ${data.reference}. Lines on the same page ${data.total.same_page}%, on any page ${data.total.any_page}%, pages as Word ${data.total.pages_as_reference}/${data.total.documents}, mean shift ${data.total.mean_shift} pt. Words in place ${format(data.total.words_in_place)}%, regions matched ${format(data.total.regions_matched)}%.`];
for (const [variant, total] of Object.entries(data.baseline)) {
  lines.push(`Baseline ${variant}: same page ${total.same_page}%, mean shift ${total.mean_shift} pt, words in place ${format(total.words_in_place)}%, regions matched ${format(total.regions_matched)}%.`);
}
totals.innerHTML = lines.map(line => `<div>${line}</div>`).join("");

let sortKey = "shift", sortDown = true;
const value = (doc, key) => ({ name: doc.name, pages: doc.pages[0] === doc.pages[1] ? 0 : 1, same: percent(doc.same_page, doc.lines), shift: doc.mean_shift ?? 1000, words: percent(doc.words_in_place, doc.words), regions: percent(doc.regions_matched, doc.regions) })[key];
function drawList() {
  const sorted = [...documents].sort((a, b) => {
    const [x, y] = [value(a, sortKey), value(b, sortKey)];
    return (x < y ? -1 : x > y ? 1 : 0) * (sortDown ? -1 : 1);
  });
  document.getElementById("list").innerHTML = sorted.map(doc => {
    const same = percent(doc.same_page, doc.lines);
    const pages = doc.pages[0] === doc.pages[1] ? `${doc.pages[0]}` : `<span class="bad">${doc.pages[0]} / ${doc.pages[1]}</span>`;
    const shiftClass = doc.mean_shift === null ? "bad" : doc.mean_shift > data.shifted ? "warn" : "ok";
    return `<tr class="doc" data-name="${doc.name}"><td>${doc.name.replace(/^test_/, "")}</td><td>${pages}</td>` +
      `<td class="${same < 90 ? "bad" : same < 99 ? "warn" : "ok"}">${format(same)}%</td><td class="${shiftClass}">${format(doc.mean_shift, 2)}</td>` +
      [percent(doc.words_in_place, doc.words), percent(doc.regions_matched, doc.regions)].map(share => `<td class="${share < 80 ? "bad" : share < 95 ? "warn" : "ok"}">${format(share)}%</td>`).join("") + `</tr>`;
  }).join("");
  for (const row of document.querySelectorAll("tr.doc")) row.onclick = () => { location.hash = row.dataset.name; };
  pick();
}
for (const header of document.querySelectorAll("th")) {
  header.onclick = () => { sortDown = sortKey === header.dataset.key ? !sortDown : header.dataset.key !== "name"; sortKey = header.dataset.key; drawList(); };
}

function sheet(doc, number, side) {
  const names = side === "converted" ? doc.converted_pages : doc.reference_pages;
  if (number >= names.length) return `<div class="sheet empty">no page ${number + 1}</div>`;
  return `<div class="sheet"><img loading="lazy" src="${side}/${names[number]}" alt="${doc.name} page ${number + 1}, ${side}"></div>`;
}

// Where the line of swipe stands, as a share of the width: Word on its left, pandoc-service on its right
let split = 0.5;

function draw(doc) {
  const mode = document.querySelector("input[name=mode]:checked").value;
  const amount = document.getElementById("amount").value;
  document.getElementById("amount-label").style.display = mode === "overlay" ? "" : "none";
  document.getElementById("swipe-hint").style.display = mode === "swipe" ? "" : "none";
  const count = Math.max(doc.reference_pages.length, doc.converted_pages.length);
  const parts = [];
  for (let number = 0; number < count; number++) {
    if (mode === "difference") {
      parts.push(`<div><div class="caption">page ${number + 1}: Word in gray, pandoc-service in red, regions which differ framed</div><div class="pair stacked">` +
        (number < doc.difference_pages.length ? `<div class="sheet"><img loading="lazy" src="difference/${doc.difference_pages[number]}" alt="${doc.name} page ${number + 1}, difference"></div>` : `<div class="sheet empty">no page ${number + 1} in Word</div>`) + `</div></div>`);
    } else if (mode === "side") {
      parts.push(`<div><div class="caption">page ${number + 1}: Word | pandoc-service</div><div class="pair">${sheet(doc, number, "reference")}${sheet(doc, number, "converted")}</div></div>`);
    } else if (number < doc.reference_pages.length && number < doc.converted_pages.length) {
      const swipe = mode === "swipe";
      const top = swipe ? `clip-path:inset(0 0 0 ${split * 100}%)` : `opacity:${amount / 100}`;
      const line = swipe ? `<div class="line" tabindex="0" role="slider" aria-label="Split between Word and pandoc-service" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(split * 100)}" style="left:${split * 100}%"></div>` +
        `<span class="tag left">Word</span><span class="tag right">pandoc-service</span>` : "";
      parts.push(`<div><div class="caption">page ${number + 1}: Word under pandoc-service</div><div class="pair stacked"><div class="sheet${swipe ? " swipe" : ""}"><img loading="lazy" src="reference/${doc.reference_pages[number]}" alt="">` +
        `<div class="top" style="${top}"><img loading="lazy" src="converted/${doc.converted_pages[number]}" alt=""></div>${line}</div></div></div>`);
    } else {
      parts.push(`<div><div class="caption">page ${number + 1}</div><div class="pair stacked">${sheet(doc, number, number < doc.reference_pages.length ? "reference" : "converted")}</div></div>`);
    }
  }
  const pages = document.getElementById("pages");
  pages.innerHTML = parts.join("");
}

function pick() {
  const name = decodeURIComponent(location.hash.slice(1));
  const doc = documents.find(candidate => candidate.name === name);
  for (const row of document.querySelectorAll("tr.doc")) row.classList.toggle("picked", row.dataset.name === name);
  if (!doc) return;
  document.getElementById("title").textContent = doc.name;
  document.getElementById("facts").innerHTML = `Pages ${doc.pages[0]} in Word, ${doc.pages[1]} converted. ${doc.same_page} of ${doc.lines} lines on the same page, ` +
    `${doc.any_page} on any page, mean shift ${format(doc.mean_shift, 2)} pt. ${doc.words_in_place} of ${doc.words} words in place, ${doc.regions_matched} of ${doc.regions} regions matched. <a href="docx/${doc.name}.docx">DOCX</a>`;
  document.getElementById("problems").innerHTML = doc.problems.map(problem =>
    `<li class="${problem.dy === null ? "bad" : "warn"}">p${problem.line.page + 1}: ${problem.line.text.replace(/</g, "&lt;")} ${problem.dy === null ? "(missing)" : `(${problem.dy > 0 ? "+" : ""}${problem.dy} pt)`}</li>`).join("");
  draw(doc);
}
// Moves the line of every page in place: the pages stay as they are
function moveSplit(value) {
  split = Math.min(1, Math.max(0, value));
  for (const top of document.querySelectorAll(".sheet.swipe .top")) top.style.clipPath = `inset(0 0 0 ${split * 100}%)`;
  for (const line of document.querySelectorAll(".sheet.swipe .line")) {
    line.style.left = `${split * 100}%`;
    line.setAttribute("aria-valuenow", String(Math.round(split * 100)));
  }
}

const pages = document.getElementById("pages");
let dragged = null;
let pending = null;
// At most one move per frame: a pointer reports more often than the screen paints
const follow = (event) => {
  const box = dragged.getBoundingClientRect();
  if (pending === null) requestAnimationFrame(() => { moveSplit(pending); pending = null; });
  pending = (event.clientX - box.left) / box.width;
};
pages.addEventListener("pointerdown", (event) => {
  const sheet = event.target.closest(".sheet.swipe");
  if (!sheet) return;
  // No selection starts under a drag of the line
  event.preventDefault();
  dragged = sheet;
  sheet.setPointerCapture(event.pointerId);
  follow(event);
});
pages.addEventListener("pointermove", (event) => { if (dragged) follow(event); });
pages.addEventListener("pointerup", () => { dragged = null; });
pages.addEventListener("pointercancel", () => { dragged = null; });
pages.addEventListener("keydown", (event) => {
  if (!event.target.classList.contains("line")) return;
  const step = { ArrowLeft: -0.01, ArrowRight: 0.01, PageDown: -0.1, PageUp: 0.1 }[event.key];
  if (step === undefined) return;
  event.preventDefault();
  moveSplit(split + (event.shiftKey ? step * 10 : step));
});
// The amount of overlay changes the opacity in place as well
document.getElementById("amount").oninput = (event) => {
  for (const top of document.querySelectorAll(".sheet .top")) top.style.opacity = event.target.value / 100;
};
for (const input of document.querySelectorAll("input[name=mode]")) input.onchange = pick;
window.onhashchange = pick;
if (!location.hash) location.hash = [...documents].sort((a, b) => (b.mean_shift ?? 1000) - (a.mean_shift ?? 1000))[0].name;
drawList();
</script>
</body>
</html>
