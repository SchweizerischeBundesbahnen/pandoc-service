name: DOCX corpus
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: corpus-${{ github.ref }}
  cancel-in-progress: true
jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - name: 📄 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - name: Set up Python from .tool-versions
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version-file: .tool-versions
      - name: 🧱 Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false
      - name: 🧱 Install dependencies
        run: uv sync --group test --frozen
      - name: 🧱 Build image
        run: docker build --tag pandoc-service:corpus .
      - name: 📊 Convert and compare with Word
        # Reports what got worse than corpus/baseline.json without failing: the page shows it in detail
        run: |
          status=0
          uv run python -m tools.corpus.corpus all --image pandoc-service:corpus --out out/corpus/image --variant image --against || status=$?
          cat out/corpus/image/report.md >> "$GITHUB_STEP_SUMMARY"
          uv run python -m tools.corpus.corpus all --image pandoc-service:corpus --docx corpus/docx-free --reference macos-free --out out/corpus/free --variant image --against || status=$?
          cat out/corpus/free/report.md >> "$GITHUB_STEP_SUMMARY"
          # The free-font corpus is published under free/ of the page
          cp -r out/corpus/free/site out/corpus/image/site/free
          if [ "$status" -ne 0 ]; then echo "::warning::The corpus got worse than corpus/baseline.json, see the summary"; fi
      - name: 📦 Upload the page
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: out/corpus/image/site
  deploy:
    needs: corpus
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
