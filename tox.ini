[tox]
envlist =
    ruff
    ty
    test

[testenv]
runner = uv-venv-lock-runner
dependency_groups =
    dev
    test
setenv =
    # macOS: Set library path for WeasyPrint system dependencies
    DYLD_LIBRARY_PATH = /opt/homebrew/lib:{env:DYLD_LIBRARY_PATH:}
commands =
    coverage run -m pytest tests/ --junitxml="junittest.xml" -v
    coverage report -m --fail-under 90
    coverage xml

[testenv:ruff]
description = run ruff linter and formatter
package = skip
dependency_groups = dev
commands =
    ruff format
    ruff check

[testenv:ty]
description = run ty type checker
package = skip
# The corpus tool in tools/ reads the PDFs with the packages of the tests
dependency_groups = dev, test
commands =
    ty check

[coverage:run]
relative_files = True
source = app/
branch = True
